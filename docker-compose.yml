# Local development dependencies.
# Production uses the bank's managed PostgreSQL, file server and mail/AV
# infrastructure; this file exists so a developer can run the full stack —
# including the fail-closed AV path — without installing those services.
services:
  postgres:
    image: postgres:18-alpine
    container_name: nib_valuation_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nib_valuation
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nib_valuation']
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: nib_valuation_mail
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI

  clamav:
    image: clamav/clamav:stable
    container_name: nib_valuation_av
    ports:
      - '3310:3310'
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --version || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: nib_valuation_storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
